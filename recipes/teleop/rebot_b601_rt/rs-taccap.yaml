# RS B601 + TacCap, single-arm Pico4 teleoperation.
#   lerobot-teleoperate --config_path=recipes/teleop/rebot_b601_rt/rs-taccap.yaml
# Set channel to the arm's SocketCAN interface; side must match the TacCap firmware SN.
robot:
  type: rebot_b601_rt
  id: rebot_rs_taccap
  motor_family: rs
  control_mode: pos_vel
  interpolate_cartesian_targets: true # native 100 Hz substeps; also applies to MIT
  mit_velocity_feedforward: false # MIT tracks interpolated position with dq=0; Kd still provides damping
  channel: can0
  max_joint_speed: 1.5 # rad/s per joint during teleoperation
  # Optional [J1, J2, J3, J4, J5, J6] in rad/s; replaces max_joint_speed for the arm.
  # max_joint_speeds: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
  coordinate_cartesian_speed: true # slow TCP translation/rotation together at joint limits
  reset_joint_speed: 0.5 # rad/s for startup, A-button reset and exit return
  reset_position_rad: [0, 0.8, 0.8, -0.5, 0, 0] # Startup and A-button pose, J1..J6 in radians
  reset_tolerance_rad: 0.06 # Startup/A-button tolerance; also accommodates MIT when selected
  exit_reset_tolerance_rad: 0.03 # Stricter feedback tolerance before disabling at zero
  reset_on_exit: true # Ctrl+C / normal completion: return all six joints to zero before disconnecting
  gripper:
    type: taccap_follower
    side: right
    auto_discover_cameras: true
    enable_tactile: true

teleop:
  type: pico4

fps: 30
display_data: true
